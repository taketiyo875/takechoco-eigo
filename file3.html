            text-align: center;
            border: 3px solid var(--primary-orange);

        h1 {

            margin-bottom: 20px;
        }

        .cat-decoration {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* ホーム画面 */
        .filter-group {
            margin: 20px 0;
        }

        .filter-btn {
            background-color: #FFFFFF;
            border: 2px solid var(--primary-orange);
            color: var(--primary-orange);
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.selected {
            background-color: var(--primary-orange);
            color: #FFFFFF;
        }

        .input-group {
            margin: 25px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .input-group input {
            width: 80px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
            border: 2px solid var(--primary-orange);
            border-radius: 10px;
            outline: none;
        }

        .start-btn {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 133, 27, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .start-btn:hover {
            background-color: var(--hover-orange);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;

            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
            min-height: 40px;
            color: var(--text-dark);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            text-align: center;
        }

        .option-btn:hover {
            background-color: var(--hover-orange);
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-red) !important;
        }

            background-color: #7F8C8D;
            color: #FFFFFF;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

            background-color: #95A5A6;
        }

        .result-score {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-orange);
            margin: 20px 0;

            color: #FFFFFF;
            border: none;
            padding: 12px 30px;

            font-weight: bold;
            border-radius: 25px;

</head>
