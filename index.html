        :root {

            --correct-green: #2ECC71;
            --incorrect-red: #E74C3C;
            --bg-cream: #FFF5EB;
            --text-dark: #2C3E50;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 133, 27, 0.15);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 3px solid var(--primary-orange);
            position: relative;
        }

        h1 {
            color: var(--primary-orange);
            font-size: 24px;
            margin-bottom: 20px;
        }

        .cat-decoration {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* ホーム画面 */
        .filter-group {
            margin: 20px 0;
        }

        .filter-btn {
            background-color: #FFFFFF;
            border: 2px solid var(--primary-orange);
            color: var(--primary-orange);
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.selected {
            background-color: var(--primary-orange);
            color: #FFFFFF;
        }

        .input-group {
            margin: 25px 0;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .input-group input {
            width: 80px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
            border: 2px solid var(--primary-orange);
            border-radius: 10px;
            outline: none;
        }

        .start-btn {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 133, 27, 0.3);
            transition: background-color 0.2s, transform 0.1s;
        }

        .start-btn:hover {
            background-color: var(--hover-orange);
        }

        .start-btn:active {
            transform: scale(0.98);
        }

        /* クイズ画面 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-box {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
            min-height: 40px;
            color: var(--text-dark);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            text-align: center;
        }

        .option-btn:hover {
            background-color: var(--hover-orange);
        }

        .option-btn.correct {
            background-color: var(--correct-green) !important;
        }

        .option-btn.incorrect {
            background-color: var(--incorrect-red) !important;
        }

        .home-nav-btn {
            background-color: #7F8C8D;
            color: #FFFFFF;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .home-nav-btn:hover {
            background-color: #95A5A6;
        }

        /* 結果画面 */
        .result-score {
            font-size: 32px;
            font-weight: bold;
            color: var(--primary-orange);
            margin: 20px 0;
        }

        .restart-btn {
            background-color: var(--primary-orange);
            color: #FFFFFF;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>

<div class="container">
    <div class="cat-decoration">🐾 🐱 🐾</div>

        <button class="start-btn" onclick="startQuiz()">クイズを始める🐾</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen">

        <p style="color: #7F8C8D; margin: 0;">この日本語に合う英語を選んでニャ！</p>
        <div id="question-text" class="question-box"></div>
        <div class="options-list">

            <button class="option-btn" onclick="checkAnswer(2)"></button>
            <button class="option-btn" onclick="checkAnswer(3)"></button>

    </div>

    <!-- 結果画面 -->

        <p id="result-comment"></p>
        <button class="restart-btn" onclick="showHomeScreen()">もう一度あそぶ🐾</button>
    </div>
</div>

el: 'advanced' },{ english: 'gnarled', japanese: '節だらけの、ねじくれた', level: 'advanced' },{ english: 'gnash', japanese: '歯ぎしりする', level: 'advanced' },{ english: 'gnat', japanese: 'ブヨ、ブユ（昆虫）', level: 'advanced' },{ english: 'gnaw', japanese: 'かじる、骨をかじる', level: 'advanced' },{ english: 'gnome', japanese: '地中の精、ノーム', level: 'advanced' },{ english: 'goal', japanese: '目標、ゴール', level: 'advanced' },{ english: 'goat', japanese: '山羊（ヤギ）', level: 'advanced' }];let currentFilter = 'all';let quizQuestions = [];let currentIndex = 0;let score = 0;let isAnswered = false;// レベルフィルター切り替え（修正版）function setFilter(level) {currentFilter = level;// 全てのボタンから selected クラスを外すdocument.getElementById('btn-all').classList.remove('selected');document.getElementById('btn-basic').classList.remove('selected');document.getElementById('btn-intermediate').classList.remove('selected');document.getElementById('btn-advanced').classList.remove('selected');// 選択されたボタンを光らせるdocument.getElementById(btn-${level}).classList.add('selected');// 最大表示数の制限を自動計算const filteredCount = wordDatabase.filter(w => level === 'all' || w.level === level).length;const input = document.getElementById('question-count');input.max = filteredCount;if (parseInt(input.value) > filteredCount || parseInt(input.value) === 0) {input.value = Math.min(10, filteredCount);}}// クイズ開始function startQuiz() {const inputCount = parseInt(document.getElementById('question-count').value);// 選択されたレベルでフィルタリングlet pool = wordDatabase.filter(w => currentFilter === 'all' || w.level === currentFilter);if (pool.length === 0) {alert('対象の単語が見つかりませんニャ。');return;}// 問題数制限const finalCount = Math.min(inputCount, pool.length);if (isNaN(finalCount) || finalCount <= 0) {alert('正しい問題数を入力してニャ！');return;}// シャッフルして問題を抽出shuffleArray(pool);quizQuestions = pool.slice(0, finalCount);currentIndex = 0;score = 0;// 画面切り替えdocument.getElementById('home-screen').classList.remove('active');document.getElementById('quiz-screen').classList.add('active');showQuestion();}// 問題表示function showQuestion() {isAnswered = false;const currentQuestion = quizQuestions[currentIndex];document.getElementById('progress-text').innerText = ${currentIndex + 1} / ${quizQuestions.length}問目;document.getElementById('question-text').innerText = currentQuestion.japanese;let options = [currentQuestion.english];let allEnglishWords = wordDatabase.map(w => w.english);while (options.length < 4) {let randomWord = allEnglishWords[Math.floor(Math.random() * allEnglishWords.length)];if (!options.includes(randomWord)) {options.push(randomWord);}}shuffleArray(options);const buttons = document.querySelectorAll('.option-btn');buttons.forEach((btn, index) => {btn.innerText = options[index];btn.className = 'option-btn';btn.disabled = false;if (options[index] === currentQuestion.english) {btn.dataset.correct = "true";} else {btn.dataset.correct = "false";}});}// 判定処理function checkAnswer(selectedIndex) {if (isAnswered) return;isAnswered = true;const buttons = document.querySelectorAll('.option-btn');const selectedButton = buttons[selectedIndex];if (selectedButton.dataset.correct === "true") {selectedButton.classList.add('correct');score++;} else {selectedButton.classList.add('incorrect');buttons.forEach(btn => {if (btn.dataset.correct === "true") {btn.classList.add('correct');}});}buttons.forEach(btn => btn.disabled = true);setTimeout(() => {currentIndex++;if (currentIndex < quizQuestions.length) {showQuestion();} else {showResult();}}, 1200);}// 結果表示function showResult() {document.getElementById('quiz-screen').classList.remove('active');document.getElementById('result-screen').classList.add('active');document.getElementById('result-score-text').innerText = ${quizQuestions.length}問中 ${score}問正解！;let comment = '';const rate = score / quizQuestions.length;if (rate === 1) {comment = 'カンペキニャ！素晴らしいニャン！🐾';} else if (rate >= 0.8) {comment = 'すごいニャ！その調子でがんばるニャ！✨';} else if (rate >= 0.5) {comment = '半分以上あってるニャ！あともう一息ニャ。🐾';} else {comment = 'これからニャ！何度も挑戦して覚えるニャ。🐱';}document.getElementById('result-comment').innerText = comment;}// ホームに戻る（アラート付き）function confirmGoHome() {if (confirm('データが消えるけど大丈夫かニャ？')) {showHomeScreen();}}// ホーム画面を表示function showHomeScreen() {document.getElementById('quiz-screen').classList.remove('active');document.getElementById('result-screen').classList.remove('active');document.getElementById('home-screen').classList.add('active');}// 配列のシャッフルfunction shuffleArray(array) {for (let i = array.length - 1; i > 0; i--) {const j = Math.floor(Math.random() * (i + 1));[array[i], array[j]] = [array[j], array[i]];}}
